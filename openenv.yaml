name: openenv-template
version: 1.0.0
description: Python code review OpenEnv environment for reinforcement learning and agent evaluation.
author: MetaX
tags:
  - openenv
  - code-review
  - rl-environment
entrypoint: app:app
port: 7860
endpoints:
  health: /health
  reset: /reset
  step: /step
  state: /state
  ws: /ws
  tasks: /tasks
  grader: /grader
  baseline: /baseline
tasks:
  - id: runtime_bug
    name: Runtime Bug Review
    difficulty: easy
    max_steps: 3
  - id: binary_search_logic
    name: Binary Search Logic Review
    difficulty: medium
    max_steps: 3
  - id: security_vulnerability
    name: Security Vulnerability Review
    difficulty: hard
    max_steps: 3
