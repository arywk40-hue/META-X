name: data-cleaning-env
version: 1.0.0
description: Data cleaning OpenEnv environment for reinforcement learning and agent evaluation.
author: Ariyan Bhakat
tags:
  - openenv
  - data-cleaning
  - rl-environment
  - tabular-data
entrypoint: app:app
port: 7860
endpoints:
  health: /health
  reset: /reset
  step: /step
  state: /state
  ws: /ws
  tasks: /tasks
  grader: /grader
  baseline: /baseline
tasks:
  - id: null_filling
    name: Missing Value Repair
    difficulty: easy
    max_steps: 5
  - id: format_standardization
    name: Date and Currency Standardization
    difficulty: medium
    max_steps: 8
  - id: duplicate_outlier
    name: Duplicate and Outlier Removal
    difficulty: medium
    max_steps: 8
  - id: multi_layer_pipeline
    name: Multi-Layer Order Data Pipeline
    difficulty: hard
    max_steps: 12
  - id: adversarial_sensor
    name: Adversarial Sensor Data
    difficulty: hard
    max_steps: 8
