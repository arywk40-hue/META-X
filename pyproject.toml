[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metax-data-cleaning-env"
version = "1.0.0"
description = "OpenEnv-compatible data cleaning and dataset preparation environment."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ariyan Bhakat" }
]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "python-dotenv==1.0.1",
  "openai==2.24.0",
  "httpx==0.28.1",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "streamlit==1.44.1",
  "PyYAML==6.0.2",
  "openenv-core>=0.2.0"
]

[project.scripts]
server = "server_runner:main"

[tool.setuptools]
py-modules = [
  "app",
  "inference",
  "prepare_dataset",
  "prepare_and_evaluate",
  "server_runner",
  "streamlit_app"
]
